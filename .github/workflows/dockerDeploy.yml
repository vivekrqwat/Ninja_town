name: deploy_docker

on:
  push:
      branches:
        - main

jobs:
  build:
    runs-on: ubuntu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 
      - name: docker_login
        uses: docker/login-action@v3
        with:
          usernaem: ${{secrets.DOCKERHUB_USERNAME}}
          token: ${{secrets.Docker_Token}}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
      - name: docker_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/Ninja_Town:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/Ninja_Town:${{ github.sha }}
        

  
    
